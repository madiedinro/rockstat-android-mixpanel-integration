buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Mixpanel Android SDK. Releases: https://github.com/mixpanel/mixpanel-android/releases
    implementation 'com.mixpanel.android:mixpanel-android:8.12.0'

    // Optional: lets the SDK read the Google Play install referrer (utm_* properties).
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // ProcessLifecycleOwner for app-level foreground/background in AutoTracker.
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
}

android {
    namespace 'com.mixpanel.example.hello'
    compileSdk 35

    defaultConfig {
        applicationId "com.mixpanel.example.hello"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Keep the historical flat layout of this sample (no app/ module, sources in src/ and res/).
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}
